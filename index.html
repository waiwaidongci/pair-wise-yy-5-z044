<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样 · 可恢复排产台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 16px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 23px; }
    h2 { font-size: 15px; margin: 16px 0 8px; border-left: 4px solid #8d3e37; padding-left: 8px; }
    h2:first-child { margin-top: 4px; }
    button { border: 0; border-radius: 7px; padding: 9px 12px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; font-size: 13px; }
    button:hover { filter: brightness(1.08); }
    button:disabled { background: #b9ab9c; cursor: not-allowed; filter: none; }
    button.secondary { background: #71675c; }
    button.small { padding: 5px 8px; font-size: 12px; }
    button.ghost { background: #ece1d1; color: #4a3f34; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    label { display: block; margin: 8px 0 4px; color: #76695e; font-size: 12px; }
    .app { display: grid; grid-template-columns: 300px 1fr 350px; gap: 14px; padding: 14px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 12px 14px; }
    .grid-wrap { position: relative; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 680px); border: 6px solid #72533c; background: #72533c; touch-action: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: crosshair; border-radius: 2px; position: relative; }
    .cell.view { cursor: default; }
    .cell .tick { position: absolute; right: 1px; bottom: 1px; font-size: 8px; line-height: 1; }
    .cell.conflict { outline: 3px solid #c22; outline-offset: -3px; animation: blink 1.2s infinite; }
    .cell.resolved { outline: 3px solid #2f7d32; outline-offset: -3px; }
    .cell.touched-w { box-shadow: inset 0 0 0 2px #2c6fbb; }
    .cell.touched-s { box-shadow: inset 0 0 0 2px #e07b1a; }
    .cell.touched-b { box-shadow: inset 0 0 0 2px #7b3fa0; }
    @keyframes blink { 50% { outline-color: #ff8a80; } }
    .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .swatch { aspect-ratio: 1; border-radius: 6px; border: 3px solid transparent; cursor: pointer; position: relative; }
    .swatch.active { border-color: #1f1b16; }
    .swatch span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 10px; font-weight: 800; color: rgba(0,0,0,.45); }
    .stat { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1d5c5; padding: 5px 0; font-size: 13px; gap: 6px; }
    .stat .cap { color: #76695e; font-size: 11px; }
    .stat .gap { color: #fff; background: #a03a2e; border-radius: 4px; padding: 1px 6px; font-weight: 800; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .ok { color: #2f7d32; font-weight: 800; }
    .muted { color: #8a7d70; font-size: 12px; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
    .badge.draft { background: #efe6d6; color: #6b5d4c; }
    .badge.merged { background: #e2edf8; color: #2c5d8f; }
    .badge.conflict { background: #f8d7d2; color: #a03a2e; }
    .badge.confirmed { background: #dff0e0; color: #2f7d32; }
    .badge.queued { background: #fbe3c4; color: #a05a12; }
    .badge.locked { background: #e2edf8; color: #2c5d8f; }
    .badge.weaving { background: #d9c8ec; color: #5a2d8c; }
    .badge.closed { background: #e0d8cd; color: #5d544a; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #e7ddcc; padding: 3px; border-radius: 8px; }
    .seg button { background: transparent; color: #6b5d4c; padding: 7px 4px; }
    .seg button.active { background: #fffaf2; color: #8d3e37; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .conflict-row { border: 1px solid #e3cbc6; background: #fdf4f2; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 13px; }
    .conflict-row.resolved { border-color: #b9d9bb; background: #f2f9f2; }
    .conflict-row .opts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.15); }
    .log { font-size: 11px; font-family: ui-monospace, Menlo, monospace; background: #2b2620; color: #e8ddca; border-radius: 6px; padding: 8px; max-height: 150px; overflow: auto; white-space: pre-wrap; }
    .log .err { color: #ff9e8e; } .log .ok2 { color: #9fdba4; }
    table.caps { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.caps td { padding: 3px 2px; }
    table.caps input { padding: 5px; }
    .meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; margin: 6px 0; }
    .meta b { color: #4a3f34; }
    .netline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.on { background: #2f7d32; } .dot.off { background: #a03a2e; }
    @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>手工织锦纹样 · 可恢复排产台</h1>
      <div class="muted">网格 / 色线 / 织造批次 / 交付包一条链：冲突仲裁、容量排队、按批次号恢复</div>
    </div>
    <div class="toolbar" style="grid-template-columns: auto auto auto;">
      <button id="exportBtn" class="secondary">导出当前方案 JSON</button>
      <button id="resetDemoBtn" class="ghost">清空演示数据</button>
    </div>
  </header>
  <main class="app">
    <!-- 左：方案与批次 -->
    <aside class="panel">
      <h2>方案</h2>
      <select id="planSelect"></select>
      <div class="toolbar" style="margin-top:8px">
        <button id="newPlanBtn">新建方案</button>
        <button id="importLegacyBtn" class="secondary">迁入旧稿</button>
      </div>
      <div class="meta" id="planMeta"></div>

      <h2>织造批次（锁定排产依据）</h2>
      <div id="batchPanel"></div>

      <h2>回传通道 / 恢复</h2>
      <div class="netline">
        <span class="dot" id="netDot"></span><span id="netText" class="muted"></span>
      </div>
      <div class="toolbar">
        <button id="toggleNetBtn" class="secondary small">断网 / 联网</button>
        <button id="interruptBtn" class="secondary small">模拟写入中断 ×1</button>
      </div>
      <div class="toolbar" style="margin-top:6px">
        <button id="dupBtn" class="ghost small">模拟旧稿重复回传</button>
        <button id="recoverBtn" class="small">按批次号恢复同步</button>
      </div>
      <label>回传队列</label>
      <div class="log" id="outboxLog">（空）</div>
    </aside>

    <!-- 中：网格 -->
    <section class="panel grid-wrap">
      <div class="seg" id="viewSeg">
        <button data-view="workshop" class="active">织造车间稿</button>
        <button data-view="sample">打样间稿</button>
        <button data-view="merged">合版/确认视图</button>
      </div>
      <p class="muted" id="viewHint" style="margin:8px 0 10px"></p>
      <div class="grid" id="grid"></div>
      <div class="toolbar" style="margin-top:12px">
        <button id="mergeBtn" class="secondary">合版（车间值优先）</button>
        <button id="confirmBtn">确认新版</button>
      </div>
    </section>

    <!-- 右：色线、统计、冲突、风险、交付包 -->
    <aside class="panel">
      <h2>色线库（点击取色）</h2>
      <div class="palette" id="palette"></div>
      <h2>用色统计与断线风险</h2>
      <div id="stats"></div>
      <h2>冲突处理 <span id="conflictCount" class="badge conflict" style="display:none"></span></h2>
      <div id="conflicts" class="muted">无待处理冲突。</div>
      <h2>交付包</h2>
      <div id="packages"></div>
    </aside>
  </main>
  <script src="src/core.js"></script>
  <script src="src/fakeServer.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
